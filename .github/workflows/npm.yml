name: Publish to npm

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Determine release channel
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"

          if [[ "$EVENT_NAME" == "release" ]]; then
            if [[ "${RELEASE_TAG#v}" != "$version" ]]; then
              echo "GitHub release tag '$RELEASE_TAG' does not match package version '$version'." >&2
              exit 1
            fi

            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              channel="beta"
            else
              channel="latest"
            fi
          elif [[ "$version" == *-* ]]; then
            channel="beta"
          else
            channel="latest"
          fi

          if [[ "$channel" == "beta" && "$version" != *-* ]]; then
            echo "A prerelease must use a prerelease package version, got '$version'." >&2
            exit 1
          fi

          if [[ "$channel" == "latest" && "$version" == *-* ]]; then
            echo "A stable release cannot publish prerelease version '$version' as latest." >&2
            exit 1
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Publishing homebridge-kobold@$version on the '$channel' channel."

      - name: Publish prerelease
        if: steps.release.outputs.channel == 'beta'
        run: npm publish --tag beta

      - name: Publish release
        if: steps.release.outputs.channel == 'latest'
        run: npm publish
